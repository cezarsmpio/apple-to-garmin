name: Build and publish image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "main.ts"
      - "kv.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_number }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/apple-to-garmin
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the deployment at the new image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/apple-to-garmin:${{ env.IMAGE_TAG }}
        run: |
          sed -i "s|^\( *image: \)ghcr.io/.*/apple-to-garmin:.*$|\1${IMAGE}|" \
            infra/k8s/deployment.yaml
          if git diff --quiet -- infra/k8s/deployment.yaml; then
            echo "Deployment already uses ${IMAGE}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/deployment.yaml
          git commit -m "chore(infra): deploy ${IMAGE_TAG}"
          git push origin HEAD:main
