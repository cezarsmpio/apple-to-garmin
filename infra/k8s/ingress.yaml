apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apple-to-garmin
  namespace: apple-to-garmin
  labels:
    app: apple-to-garmin
spec:
  ingressClassName: traefik
  rules:
    - host: atg.cezarsampaio.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apple-to-garmin
                port:
                  name: http
