apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: apple-to-garmin
  namespace: apple-to-garmin
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: apple-to-garmin
      environmentSlug: prod
      secretPath: /
  targets:
    - name: apple-to-garmin-secrets
      namespace: apple-to-garmin
      kind: Secret
      creationPolicy: Owner
