apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apple-to-garmin-data
  namespace: apple-to-garmin
  labels:
    app: apple-to-garmin
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
